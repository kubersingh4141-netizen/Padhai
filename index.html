          await setTopicStatusRec(t.id, next);
        }); render(); break;
      case "delete-topic": { const t = topicOf(el.dataset.id); const returnChapterId = state.ui.modal?.type === "chapter-overview" ? state.ui.modal.payload.id : null;
          openConfirm(`Delete "${t.name}"?`, "This removes the topic. Historical covered/revision/mistake records stay intact but lose their topic link.", async () => {
            await deleteTopicRec(el.dataset.id); toastOk("Topic deleted");
            if (returnChapterId) openModal("chapter-overview", { id: returnChapterId }); else closeModal();
          }); break; }

      /* ---- tests view ---- */
      case "export-tests-csv": exportTestsCSV(); break;
      case "delete-test": { const t = byId(state.tests, el.dataset.id); openConfirm(`Delete "${t.name}"?`, "This permanently deletes this test record.", async () => { await deleteTestRec(el.dataset.id); toastOk("Test deleted"); closeModal(); }); break; }
      case "toggle-test-subject": el.classList.toggle("selected"); refreshTestChapterChips(); break;
      case "toggle-test-chapter": el.classList.toggle("selected"); break;
      case "submit-test": await handleSubmitTest(el.dataset.id); break;

      /* ---- calendar ---- */
      case "cal-prev": { let m = state.ui.calendarMonth - 1, y = state.ui.calendarYear; if (m < 0) { m = 11; y--; } state.ui.calendarMonth = m; state.ui.calendarYear = y; render(); break; }
      case "cal-next": { let m = state.ui.calendarMonth + 1, y = state.ui.calendarYear; if (m > 11) { m = 0; y++; } state.ui.calendarMonth = m; state.ui.calendarYear = y; render(); break; }
      case "cal-today": state.ui.calendarMonth = new Date().getMonth(); state.ui.calendarYear = new Date().getFullYear(); state.ui.calendarSelectedDate = todayISO(); render(); break;
      case "cal-select": state.ui.calendarSelectedDate = el.dataset.date; render(); break;

      /* ---- revisions ---- */
      case "rev-view": state.ui.revisionFilter.view = el.dataset.view; render(); break;
      case "export-revisions-csv": exportRevisionsCSV(); break;
      case "delete-revision": openConfirm("Delete this revision?", "This removes it from the topic's revision history.", async () => { await deleteRevisionRec(el.dataset.id); toastOk("Revision deleted"); closeModal(); }); break;
      case "set-next-rev-preset": { const inp = document.getElementById("revision-next-date"); if (inp) inp.value = addDays(document.getElementById("revision-date")?.value || todayISO(), Number(el.dataset.days)); break; }
      case "submit-revision": await handleSubmitRevision(el.dataset.id); break;

      /* ---- mistakes ---- */
      case "mistake-filter": state.ui.mistakeFilter.status = el.dataset.status; render(); break;
      case "export-mistakes-csv": exportMistakesCSV(); break;
      case "toggle-mistake": await withSaving(() => toggleMistakeStatusRec(el.dataset.id)); render(); break;
      case "delete-mistake": openConfirm("Delete this mistake?", "This permanently removes it from your mistake log.", async () => { await deleteMistakeRec(el.dataset.id); toastOk("Mistake deleted"); closeModal(); }); break;
      case "submit-mistake": await handleSubmitMistake(el.dataset.id); break;

      /* ---- settings ---- */
      case "set-theme": await withSaving(() => updateSettingsRec({ theme: el.dataset.theme })); applyThemeToDOM(); render(); break;
      case "toggle-dark-checkbox": await withSaving(() => updateSettingsRec({ dark_mode: !state.settings.dark_mode })); applyThemeToDOM(); render(); break;
      case "set-density": await withSaving(() => updateSettingsRec({ density: el.dataset.density })); render(); break;
      case "save-goals": await handleSaveGoals(); break;
      case "delete-tag": openConfirm("Delete this tag?", "It will be removed from everything it's tagged on.", async () => { await deleteTagRec(el.dataset.id); toastOk("Tag deleted"); closeModal(); }); break;
      case "export-json": exportJSONFile(); toastOk("Backup downloaded"); break;
      case "trigger-import": document.getElementById("import-file-input")?.click(); break;
      case "run-import": await handleRunImport(); break;

      /* ---- subject/chapter/topic/covered forms ---- */
      case "pick-subject-color":
        document.getElementById("subject-selected-color").value = el.dataset.color;
        document.querySelectorAll("#subject-color-row .swatch").forEach((s) => s.classList.remove("selected"));
        el.classList.add("selected"); break;
      case "pick-subject-icon":
        document.getElementById("subject-selected-icon").value = el.dataset.icon;
        document.querySelectorAll("#subject-icon-row .icon-pick").forEach((s) => s.classList.remove("selected"));
        el.classList.add("selected"); break;
      case "submit-subject": await handleSubmitSubject(el.dataset.id); break;
      case "submit-chapter": await handleSubmitChapter(el.dataset.id); break;
      case "submit-topic": await handleSubmitTopic(el.dataset.id); break;
      case "submit-covered": await handleSubmitCovered(); break;
      case "submit-edit-covered": await handleSubmitEditCovered(el.dataset.id); break;

      default: break;
    }
  } catch (err) {
    console.error(err);
    toastErr(err.message || "Something went wrong.");
    render();
  }
});

document.addEventListener("change", async (e) => {
  const el = e.target;
  const action = el.dataset && el.dataset.action;
  if (!action) return;
  try {
    switch (action) {
      case "study-filter": {
        const field = el.dataset.field;
        state.ui.studyFilters[field] = el.value;
        if (field === "subjectId") state.ui.studyFilters.chapterId = "";
        render(); break;
      }
      case "test-filter-subject": state.ui.testFilter.subjectId = el.value; render(); break;
      case "covered-subject-change": {
        const chapId = chaptersOfSubject(el.value)[0]?.id || "";
        document.getElementById("covered-chapter-select").innerHTML = chapterOptionsHTML(el.value, chapId);
        document.getElementById("covered-topic-list").innerHTML = topicPickListHTML(chapId, [], !!state.ui.modal.payload.id);
        if (window.lucide) lucide.createIcons();
        break;
      }
      case "covered-chapter-change":
        document.getElementById("covered-topic-list").innerHTML = topicPickListHTML(el.value, [], !!state.ui.modal.payload.id);
        if (window.lucide) lucide.createIcons();
        break;
      case "mistake-subject-change": {
        const chapSel = document.getElementById("mistake-chapter-select");
        chapSel.innerHTML = `<option value="">—</option>${chapterOptionsHTML(el.value, "")}`;
        document.getElementById("mistake-topic-select").innerHTML = `<option value="">—</option>`;
        break;
      }
      case "mistake-chapter-change": {
        const topics = topicsOfChapter(el.value);
        document.getElementById("mistake-topic-select").innerHTML = `<option value="">—</option>${topics.map((t) => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("")}`;
        break;
      }
      case "revision-subject-change": {
        const chapId = chaptersOfSubject(el.value)[0]?.id || "";
        document.getElementById("revision-chapter-select").innerHTML = chapterOptionsHTML(el.value, chapId);
        document.getElementById("revision-topic-select").innerHTML = topicsOfChapter(chapId).map((t) => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("");
        break;
      }
      case "revision-chapter-change": {
        const topics = topicsOfChapter(el.value);
        document.getElementById("revision-topic-select").innerHTML = topics.map((t) => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("");
        break;
      }
      case "topic-subject-change": {
        const chapId = chaptersOfSubject(el.value)[0]?.id || "";
        document.getElementById("topic-chapter-select").innerHTML = chapterOptionsHTML(el.value, chapId);
        break;
      }
      default: break;
    }
  } catch (err) { console.error(err); toastErr(err.message || "Something went wrong."); render(); }
});

const onSearchInput = debounce((val) => { state.ui.searchQuery = val; state.ui.searchOpen = val.trim().length > 0; render(); }, 180);
const onStudySearchInput = debounce((val) => { state.ui.studyFilters.search = val; render(); }, 220);

document.addEventListener("input", (e) => {
  const el = e.target;
  const action = el.dataset && el.dataset.action;
  if (action === "search-input") onSearchInput(el.value);
  else if (action === "study-search") onStudySearchInput(el.value);
  else if (action === "dash-custom-from") { state.ui.dashboardCustom.from = el.value; render(); }
  else if (action === "dash-custom-to") { state.ui.dashboardCustom.to = el.value; render(); }
  else if (action === "study-filter" && el.tagName === "INPUT") { state.ui.studyFilters[el.dataset.field] = el.value; render(); }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "new-topic-name") { e.preventDefault(); handleAddTopicInline(e.target.dataset.chapterId); }
  if (e.key === "Escape" && state.ui.modal) closeModal();
});

document.addEventListener("change", (e) => {
  if (e.target.id === "import-file-input" && e.target.files[0]) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        pendingImportPayload = parsed;
        openModal("import", {});
      } catch (err) { toastErr("That file isn't valid JSON."); }
      e.target.value = "";
    };
    reader.readAsText(file);
  }
});

/* ============================================================================
   27. FORM SUBMIT HANDLERS
   ============================================================================ */
async function handleAddTopicInline(chapterId) {
  const input = document.getElementById("new-topic-name");
  const name = input?.value.trim();
  if (!name) return;
  await withSaving(() => addTopicRec(chapterId, name));
  toastOk("Topic added");
  openModal("chapter-overview", { id: chapterId });
}

function refreshTestChapterChips() {
  const selSubjectIds = Array.from(document.querySelectorAll("#test-subject-chips .chip-select.selected")).map((b) => b.dataset.id);
  const container = document.getElementById("test-chapter-chips");
  const prevSelected = Array.from(container.querySelectorAll(".chip-select.selected")).map((b) => b.dataset.id);
  container.innerHTML = testChapterChipsHTML(selSubjectIds, prevSelected);
  if (window.lucide) lucide.createIcons();
}

async function handleSubmitTest(id) {
  const editing = !!id;
  setFieldError("test-form-error", "");
  const name = document.getElementById("test-name").value.trim();
  const date = document.getElementById("test-date").value;
  if (!name) return setFieldError("test-form-error", "Test name is required.");
  if (!date) return setFieldError("test-form-error", "Date is required.");

  const marks = numOrNull(document.getElementById("test-marks").value);
  const max = numOrNull(document.getElementById("test-max-marks").value);
  const total = numOrNull(document.getElementById("test-total-q").value);
  const attempted = numOrNull(document.getElementById("test-attempted").value);
  const correct = numOrNull(document.getElementById("test-correct").value);
  const wrong = numOrNull(document.getElementById("test-wrong").value);
  let unattempted = numOrNull(document.getElementById("test-unattempted").value);
  const time = numOrNull(document.getElementById("test-time").value);
  const notes = document.getElementById("test-notes").value.trim() || null;
  const tagsStr = document.getElementById("test-tags").value;

  if (marks !== null && max !== null && marks > max) return setFieldError("test-form-error", "Marks obtained cannot exceed maximum marks.");
  if (total !== null && attempted !== null && attempted > total) return setFieldError("test-form-error", "Attempted cannot exceed total questions.");
  if (attempted !== null && correct !== null && wrong !== null && correct + wrong > attempted) return setFieldError("test-form-error", "Correct + wrong cannot exceed attempted.");
  if (unattempted === null && total !== null && attempted !== null) unattempted = Math.max(0, total - attempted);

  const subjectIds = Array.from(document.querySelectorAll("#test-subject-chips .chip-select.selected")).map((b) => b.dataset.id);
  const chapterIds = Array.from(document.querySelectorAll("#test-chapter-chips .chip-select.selected")).map((b) => b.dataset.id);
  const tagIds = await resolveTagIds(tagsStr);
  const fields = { name, test_date: date, total_questions: total, attempted, correct, wrong, unattempted, marks_obtained: marks, max_marks: max, time_taken_minutes: time, notes };

  await withSaving(async () => {
    if (editing) await updateTestRec(id, { ...fields, subjectIds, chapterIds, tagIds });
    else await addTestRec({ ...fields, subjectIds, chapterIds, tagIds });
  });
  toastOk(editing ? "Test updated" : "Test saved");
  closeModal();
}

async function handleSubmitRevision(id) {
  const editing = !!id;
  setFieldError("revision-form-error", "");
  const lockedInput = document.getElementById("revision-topic-id");
  const topicId = lockedInput ? lockedInput.value : document.getElementById("revision-topic-select")?.value;
  if (!topicId) return setFieldError("revision-form-error", "Please choose a topic.");
  const date = document.getElementById("revision-date").value;
  if (!date) return setFieldError("revision-form-error", "Revision date is required.");
  const confidence = document.getElementById("revision-confidence").value || null;
  const nextDate = document.getElementById("revision-next-date").value || null;
  const note = document.getElementById("revision-note").value.trim() || null;

  await withSaving(async () => {
    if (editing) await updateRevisionRec(id, { revision_date: date, confidence, next_revision_date: nextDate, note });
    else await addRevisionRec({ topicId, date, nextDate, confidence, note });
  });
  toastOk(editing ? "Revision updated" : "Revision logged");
  closeModal();
}

async function handleSubmitMistake(id) {
  const editing = !!id;
  const subjectId = document.getElementById("mistake-subject-select").value || null;
  const chapterId = document.getElementById("mistake-chapter-select").value || null;
  const topicId = document.getElementById("mistake-topic-select").value || null;
  const testId = document.getElementById("mistake-test-select").value || null;
  const mistakeType = document.getElementById("mistake-type-select").value;
  const explanation = document.getElementById("mistake-explanation").value.trim() || null;
  const fields = { subject_id: subjectId, chapter_id: chapterId, topic_id: topicId, test_id: testId, mistake_type: mistakeType, explanation };

  await withSaving(async () => {
    if (editing) await updateMistakeRec(id, fields);
    else await addMistakeRec({ ...fields, status: "pending" });
  });
  toastOk(editing ? "Mistake updated" : "Mistake logged");
  closeModal();
}

async function handleSaveGoals() {
  const daily = parseInt(document.getElementById("settings-daily-goal").value, 10);
  const weekly = parseInt(document.getElementById("settings-weekly-goal").value, 10);
  if (!daily || daily < 1 || !weekly || weekly < 1) { toastErr("Goals must be at least 1."); return; }
  await withSaving(() => updateSettingsRec({ daily_goal: daily, weekly_goal: weekly }));
  toastOk("Goals updated");
  render();
}

async function handleRunImport() {
  const mode = document.querySelector('input[name="import-mode"]:checked')?.value || "merge";
  if (!pendingImportPayload) { toastErr("No file selected."); return; }
  await withSaving(async () => {
    await importJSONFile(pendingImportPayload, mode);
    pendingImportPayload = null;
  });
  toastOk("Import complete");
  closeModal();
}

async function handleSubmitSubject(id) {
  const editing = !!id;
  setFieldError("subject-form-error", "");
  const name = document.getElementById("subject-name").value.trim();
  if (!name) return setFieldError("subject-form-error", "Subject name is required.");
  const color = document.getElementById("subject-selected-color").value;
  const icon = document.getElementById("subject-selected-icon").value;
  await withSaving(async () => {
    if (editing) await updateSubjectRec(id, { name, color, icon });
    else await addSubject(name, color, icon);
  });
  toastOk(editing ? "Subject updated" : "Subject added");
  closeModal();
}

async function handleSubmitChapter(id) {
  const editing = !!id;
  setFieldError("chapter-form-error", "");
  const name = document.getElementById("chapter-name").value.trim();
  const subjectId = document.getElementById("chapter-subject-select").value;
  if (!name) return setFieldError("chapter-form-error", "Chapter name is required.");
  await withSaving(async () => {
    if (editing) await updateChapterRec(id, { name, subject_id: subjectId });
    else await addChapterRec(subjectId, name);
  });
  toastOk(editing ? "Chapter updated" : "Chapter added");
  closeModal();
}

async function handleSubmitTopic(id) {
  const editing = !!id;
  setFieldError("topic-form-error", "");
  const name = document.getElementById("topic-name").value.trim();
  if (!name) return setFieldError("topic-form-error", "Topic name is required.");
  if (editing) {
    const status = document.getElementById("topic-status").value;
    await withSaving(() => updateTopicRec(id, { name, status }));
    toastOk("Topic updated");
  } else {
    const chapterId = document.getElementById("topic-chapter-select")?.value;
    if (!chapterId) return setFieldError("topic-form-error", "Please choose a chapter.");
    await withSaving(() => addTopicRec(chapterId, name));
    toastOk("Topic added");
  }
  closeModal();
}

async function handleSubmitCovered() {
  setFieldError("covered-form-error", "");
  const date = document.getElementById("covered-date").value;
  if (!date) return setFieldError("covered-form-error", "Date is required.");
  const topicIds = Array.from(document.querySelectorAll("#covered-topic-list input:checked")).map((i) => i.value);
  if (!topicIds.length) return setFieldError("covered-form-error", "Select at least one topic.");
  const note = document.getElementById("covered-note").value.trim() || null;
  const tagIds = await resolveTagIds(document.getElementById("covered-tags").value);
  await withSaving(() => logCoveredRec({ topicIds, date, note, tagIds }));
  toastOk(`${topicIds.length} topic${topicIds.length > 1 ? "s" : ""} marked as covered`);
  closeModal();
}

async function handleSubmitEditCovered(id) {
  setFieldError("covered-form-error", "");
  const date = document.getElementById("covered-date").value;
  if (!date) return setFieldError("covered-form-error", "Date is required.");
  const radio = document.querySelector("#covered-topic-list input:checked");
  if (!radio) return setFieldError("covered-form-error", "Select a topic.");
  const topicId = radio.value;
  const note = document.getElementById("covered-note").value.trim() || null;
  const topic = topicOf(topicId);
  const chapter = topic ? chapterOf(topic.chapter_id) : null;
  const subject = chapter ? subjectOf(chapter.subject_id) : null;
  const patch = { covered_date: date, note };
  if (topic && chapter && subject) Object.assign(patch, { topic_id: topic.id, chapter_id: chapter.id, subject_id: subject.id, topic_name: topic.name, chapter_name: chapter.name, subject_name: subject.name });

  await withSaving(async () => {
    await updateCoveredRec(id, patch);
    await syncEntityTags("covered", id, document.getElementById("covered-tags").value);
  });
  toastOk("Covered entry updated");
  closeModal();
}

/* ============================================================================
   28. INITIALIZATION
   ============================================================================ */
async function bootLoad() {
  state.loadError = null;
  try {
    await loadAllData();
  } catch (e) {
    console.error(e);
    state.loadError = e.message || "Unable to load your study data.";
  }
}

async function initApp() {
  applyThemeToDOM();
  const ok = initSupabaseClient();
  if (ok) {
    await bootLoad();
    applyThemeToDOM();
  }
  render();
}

initApp();
</script>

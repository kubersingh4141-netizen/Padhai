<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Covered — Study Tracker</title>
<meta name="description" content="A personal study tracker: log what you covered, see what's next, track tests, revisions and mistakes." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   DESIGN TOKENS — theme variants + dark mode
   ========================================================================== */
:root{
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;

  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
  --radius-pill:999px;

  --shadow-sm:0 1px 3px rgba(60,40,90,.06), 0 1px 2px rgba(60,40,90,.05);
  --shadow-md:0 8px 24px rgba(60,40,90,.10), 0 2px 6px rgba(60,40,90,.06);
  --shadow-lg:0 20px 48px rgba(60,40,90,.16);

  --success:#5FAF82;
  --success-bg:#E4F5EC;
  --warning:#E0A23E;
  --warning-bg:#FBEEDA;
  --danger:#E06C8B;
  --danger-bg:#FBE6EC;

  /* default theme: Lavender Dream */
  --bg:#FAF7FC;
  --surface:#FFFFFF;
  --surface-2:#F4EFFA;
  --primary:#8B7CD9;
  --primary-dark:#6F5FC4;
  --primary-soft:#EDE8FA;
  --accent:#F2A6C4;
  --accent-soft:#FCE9F0;
  --text:#2D2A3D;
  --muted:#8B87A0;
  --border:#ECE6F7;
  --focus:#8B7CD9;
}
[data-theme="lavender-dream"]{
  --bg:#FAF7FC; --surface:#FFFFFF; --surface-2:#F4EFFA;
  --primary:#8B7CD9; --primary-dark:#6F5FC4; --primary-soft:#EDE8FA;
  --accent:#F2A6C4; --accent-soft:#FCE9F0;
  --text:#2D2A3D; --muted:#8B87A0; --border:#ECE6F7; --focus:#8B7CD9;
}
[data-theme="soft-rose"]{
  --bg:#FDF5F7; --surface:#FFFFFF; --surface-2:#FBE9EE;
  --primary:#E0728F; --primary-dark:#C2597A; --primary-soft:#FBE3EA;
  --accent:#F7C9D8; --accent-soft:#FDF0F4;
  --text:#3A2A30; --muted:#9A7E85; --border:#F6E3E9; --focus:#E0728F;
}
[data-theme="mint-cream"]{
  --bg:#F4FBF7; --surface:#FFFFFF; --surface-2:#E4F5EC;
  --primary:#4FA47B; --primary-dark:#3D8663; --primary-soft:#DFF3E7;
  --accent:#BEE6D0; --accent-soft:#EEF9F2;
  --text:#22352C; --muted:#7C9A8B; --border:#DCF0E4; --focus:#4FA47B;
}
[data-theme="sky-blue"]{
  --bg:#F3F8FD; --surface:#FFFFFF; --surface-2:#E3EFFB;
  --primary:#4E8BC4; --primary-dark:#3B6FA0; --primary-soft:#DFEBF9;
  --accent:#BFDCF2; --accent-soft:#EFF6FC;
  --text:#23303D; --muted:#7C93A8; --border:#DCEAF8; --focus:#4E8BC4;
}
[data-theme="peach"]{
  --bg:#FDF7F1; --surface:#FFFFFF; --surface-2:#FBEAD7;
  --primary:#DA8C48; --primary-dark:#B96F35; --primary-soft:#F8E4CC;
  --accent:#F8D3AC; --accent-soft:#FDF2E6;
  --text:#3A2E22; --muted:#9C8873; --border:#F5E3CE; --focus:#DA8C48;
}
[data-mode="dark"]{
  --bg:#161320;
  --surface:#201C2E;
  --surface-2:#2A2439;
  --primary-soft:#332C49;
  --accent-soft:#3A2733;
  --text:#EFEAFA;
  --muted:#A79FC0;
  --border:#362F49;
  --shadow-sm:0 1px 3px rgba(0,0,0,.35);
  --shadow-md:0 10px 28px rgba(0,0,0,.45);
  --shadow-lg:0 24px 56px rgba(0,0,0,.55);
  --success-bg:#1E3329; --warning-bg:#3A2E16; --danger-bg:#3A1F29;
}

/* ==========================================================================
   RESET + BASE
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:600;letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
ul{list-style:none;margin:0;padding:0;}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit;}
::selection{background:var(--primary);color:#fff;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
::-webkit-scrollbar-track{background:transparent;}

.icon{width:18px;height:18px;stroke-width:2;flex-shrink:0;vertical-align:-4px;}
.icon-sm{width:14px;height:14px;}
.icon-lg{width:24px;height:24px;}

/* ==========================================================================
   APP SHELL / LAYOUT
   ========================================================================== */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:236px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);padding:22px 16px;
  display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;}
.brand-mark{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(145deg,var(--primary),var(--accent));
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  box-shadow:var(--shadow-sm);
}
.brand-name{font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1.1;}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.03em;}

.nav-list{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);
  cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;transition:background .15s,color .15s;
  border:none;background:none;text-align:left;width:100%;
}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--primary-soft);color:var(--primary-dark);}
.nav-item .badge-count{margin-left:auto;background:var(--accent-soft);color:var(--text);font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;}

.sidebar-foot{display:flex;flex-direction:column;gap:8px;}
.streak-chip{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-md);
  background:linear-gradient(135deg,var(--primary-soft),var(--accent-soft));font-size:13px;font-weight:700;
}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}

.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:14px 24px;background:color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
}
.topbar-greeting{flex:1;min-width:0;}
.topbar-greeting h1{font-size:20px;}
.topbar-date{font-size:12.5px;color:var(--muted);margin-top:1px;}
.hamburger{display:none;}
.icon-btn{
  width:40px;height:40px;border-radius:var(--radius-pill);border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--text);transition:transform .12s ease,background .15s;position:relative;flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-2);}
.icon-btn:active{transform:scale(.92);}
.icon-btn.on{background:var(--primary);color:#fff;border-color:var(--primary);}

.search-wrap{position:relative;max-width:280px;flex-shrink:1;}
.search-input{
  width:100%;padding:9px 14px 9px 36px;border-radius:var(--radius-pill);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:13.5px;
}
.search-input:focus{border-color:var(--primary);}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.search-results{
  position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);box-shadow:var(--shadow-lg);max-height:420px;overflow-y:auto;z-index:60;padding:8px;
}
.search-group-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px 4px;}
.search-result-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;}
.search-result-item:hover{background:var(--surface-2);}
.search-result-item .rtitle{font-size:13.5px;font-weight:600;}
.search-result-item .rsub{font-size:11.5px;color:var(--muted);}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:var(--radius-pill);
  border:1px solid transparent;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;
  transition:transform .1s ease,filter .15s,background .15s;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-secondary{background:var(--surface-2);color:var(--text);}
.btn-secondary:hover{background:var(--border);}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text);}
.btn-outline:hover{background:var(--surface-2);}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-danger:hover{filter:brightness(.96);}
.btn-ghost{background:none;color:var(--muted);}
.btn-ghost:hover{color:var(--text);}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:var(--radius-pill);}
.btn-block{width:100%;justify-content:center;}
.btn[disabled]{opacity:.55;cursor:not-allowed;pointer-events:none;}
.btn-icon-only{padding:8px;border-radius:var(--radius-pill);}

.view-root{flex:1;padding:22px 24px 90px;max-width:1180px;width:100%;margin:0 auto;}

/* ==========================================================================
   CARDS / SURFACES
   ========================================================================== */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px;box-shadow:var(--shadow-sm);
}
.card-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.card-title{font-family:var(--font-display);font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card-title .icon{color:var(--primary);}
.section-block{margin-bottom:26px;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.section-head h2{font-size:18px;}
.muted{color:var(--muted);}
.small{font-size:12.5px;}

.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:620px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.stat-card .stat-icon{
  width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--primary-soft);color:var(--primary-dark);margin-bottom:10px;
}
.stat-value{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1;}
.stat-label{font-size:12.5px;color:var(--muted);margin-top:5px;font-weight:600;}
.stat-sub{font-size:11.5px;color:var(--muted);margin-top:6px;}
.progress-track{height:6px;border-radius:99px;background:var(--surface-2);margin-top:10px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .5s cubic-bezier(.4,0,.2,1);}

.range-tabs{display:inline-flex;background:var(--surface-2);padding:3px;border-radius:var(--radius-pill);gap:2px;}
.range-tab{padding:7px 13px;border-radius:var(--radius-pill);border:none;background:none;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;}
.range-tab.active{background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow-sm);}

/* pill / badge / tag */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;}
.pill-not_started{background:var(--surface-2);color:var(--muted);}
.pill-in_progress{background:var(--warning-bg);color:var(--warning);}
.pill-completed{background:var(--success-bg);color:var(--success);}
.pill-pending{background:var(--warning-bg);color:var(--warning);}
.pill-resolved{background:var(--success-bg);color:var(--success);}
.tag-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--text);font-size:11px;font-weight:600;}
.color-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block;}
.subject-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;border-radius:99px;font-size:11.5px;font-weight:700;}

/* list rows (covered / test / revision / mistake entries) */
.entry-row{
  display:flex;align-items:flex-start;gap:12px;padding:13px 6px;border-bottom:1px solid var(--border);
}
.entry-row:last-child{border-bottom:none;}
.entry-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.entry-main{flex:1;min-width:0;}
.entry-crumb{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.entry-title{font-size:14.5px;font-weight:700;margin-top:2px;}
.entry-meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.entry-actions{display:flex;gap:4px;flex-shrink:0;opacity:0;transition:opacity .12s;}
.entry-row:hover .entry-actions,.entry-row:focus-within .entry-actions{opacity:1;}
.day-divider{font-size:12px;font-weight:800;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.05em;padding:14px 6px 6px;}
.day-divider:first-child{padding-top:0;}

/* ==========================================================================
   FORMS
   ========================================================================== */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--muted);}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],
.field select,.field textarea{
  width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--bg);color:var(--text);
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);background:var(--surface);}
.field textarea{resize:vertical;min-height:64px;}
.field-row{display:flex;gap:10px;}
.field-row>.field{flex:1;}
.field-hint{font-size:11px;color:var(--muted);margin-top:4px;}
.field-error{font-size:11.5px;color:var(--danger);margin-top:4px;font-weight:600;}
.checkbox-row{display:flex;align-items:center;gap:9px;padding:9px 2px;cursor:pointer;}
.checkbox-row input{width:18px;height:18px;accent-color:var(--primary);cursor:pointer;}
.swatch-row{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:28px;height:28px;border-radius:9px;cursor:pointer;border:2px solid transparent;}
.swatch.selected{border-color:var(--text);}
.icon-pick-row{display:flex;gap:8px;flex-wrap:wrap;}
.icon-pick{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.icon-pick.selected{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark);}
.chip-select-row{display:flex;gap:7px;flex-wrap:wrap;}
.chip-select{padding:7px 13px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);}
.chip-select.selected{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark);}
.topic-pick-list{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px;}
.topic-pick-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer;}
.topic-pick-row:hover{background:var(--surface-2);}

/* ==========================================================================
   MODALS
   ========================================================================== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(30,20,45,.42);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-box{
  background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  width:100%;max-width:460px;max-height:88vh;display:flex;flex-direction:column;
  animation:modalIn .2s cubic-bezier(.2,.8,.3,1.1);
}
.modal-box.modal-wide{max-width:600px;}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:none;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;flex-shrink:0;}
.modal-head h3{font-size:17px;}
.modal-body{padding:6px 20px 4px;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px 20px;flex-shrink:0;}

/* ==========================================================================
   TOASTS
   ========================================================================== */
#toast-container{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column-reverse;gap:10px;max-width:320px;}
.toast{
  display:flex;align-items:center;gap:10px;background:var(--text);color:var(--bg);
  padding:12px 16px;border-radius:var(--radius-md);box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:600;
  animation:toastIn .22s cubic-bezier(.2,.8,.3,1.1);
}
.toast.err{background:var(--danger);color:#fff;}
.toast.ok{background:var(--success);color:#fff;}
@keyframes toastIn{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:none;}}
@media (max-width:620px){#toast-container{left:16px;right:16px;bottom:78px;max-width:none;}}

/* ==========================================================================
   EMPTY / LOADING STATES
   ========================================================================== */
.empty-state{text-align:center;padding:36px 18px;color:var(--muted);}
.empty-state .empty-icon{width:52px;height:52px;border-radius:16px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--primary);}
.empty-state h4{font-size:15px;color:var(--text);margin-bottom:5px;}
.empty-state p{font-size:13px;max-width:280px;margin:0 auto;}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:var(--radius-sm);}
@keyframes sk{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

/* ==========================================================================
   CALENDAR
   ========================================================================== */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding-bottom:6px;text-transform:uppercase;}
.cal-cell{
  aspect-ratio:1;border-radius:12px;border:1px solid var(--border);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;gap:3px;
  transition:background .12s;
}
.cal-cell:hover{background:var(--surface-2);}
.cal-cell.empty{border:none;background:none;cursor:default;}
.cal-cell.today{border-color:var(--primary);}
.cal-cell .d{font-size:12.5px;font-weight:700;}
.cal-dots{display:flex;gap:2px;}
.cal-dot{width:5px;height:5px;border-radius:50%;}
.cal-cell.selected{background:var(--primary);}
.cal-cell.selected .d{color:#fff;}

/* streak ribbon (signature element) */
.streak-ribbon{display:flex;align-items:center;gap:6px;}
.streak-day{width:11px;height:11px;border-radius:4px;background:var(--surface-2);}
.streak-day.on{background:linear-gradient(135deg,var(--primary),var(--accent));}

/* ==========================================================================
   BOTTOM NAV (mobile)
   ========================================================================== */
.bottom-nav{display:none;}
@media (max-width:900px){
  .sidebar{display:none;}

/* ============================================================================
   2. SUPABASE CLIENT
   NOTE: the CDN library attaches itself to a global named `supabase`. To
   avoid shadowing that global with our own client instance (a classic bug
   in single-file Supabase apps), our client is named `sb`, not `supabase`.
   ============================================================================ */
let sb = null;
let SUPA_READY = false;
function initSupabaseClient() {
  try {
    if (!window.supabase || typeof window.supabase.createClient !== "function") return false;
    if (!SUPABASE_URL || SUPABASE_URL === "YOUR_SUPABASE_URL" || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY") {
      return false;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    SUPA_READY = true;
    return true;
  } catch (e) {
    console.error("Supabase init failed", e);
    return false;
  }
}

/* ============================================================================
   3. STATE
   ============================================================================ */
const state = {
  loaded: false,
  loadError: null,
  subjects: [], chapters: [], topics: [], covered: [],
  tags: [], tagLinks: [],
  tests: [], testSubjects: [], testChapters: [],
  mistakes: [], revisions: [],
  settings: { theme: "lavender-dream", dark_mode: false, daily_goal: 5, weekly_goal: 25, density: "comfortable" },
  ui: {
    view: "dashboard",
    mobileDrawerOpen: false,
    moreSheetOpen: false,
    dashboardRange: "today",
    dashboardCustom: { from: todayISO(), to: todayISO() },
    studyFilters: { range: "all", subjectId: "", chapterId: "", tagId: "", search: "" },
    testFilter: { subjectId: "" },
    mistakeFilter: { status: "all" },
    revisionFilter: { view: "due" },
    calendarMonth: new Date().getMonth(),
    calendarYear: new Date().getFullYear(),
    calendarSelectedDate: null,
    expandedSubjectId: null,
    searchQuery: "",
    searchOpen: false,
    modal: null,        // { type, payload }
    saving: false,
  },
};

/* ============================================================================
   4. UTILITIES
   ============================================================================ */
function todayISO() { return dateToISO(new Date()); }
function dateToISO(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function isoToDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(iso, n) { const d = isoToDate(iso); d.setDate(d.getDate() + n); return dateToISO(d); }
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2) + Date.now()); }

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function friendlyDate(iso) {
  if (!iso) return "";
  const today = todayISO();
  const yest = addDays(today, -1);
  if (iso === today) return "Today";
  if (iso === yest) return "Yesterday";
  const d = isoToDate(iso);
  const opts = d.getFullYear() === new Date().getFullYear() ? { month: "short", day: "numeric" } : { month: "short", day: "numeric", year: "numeric" };
  return d.toLocaleDateString("en-US", opts);
}
function friendlyDateTime(iso) { return friendlyDate(iso); }

function getWeekRange(iso) {
  const d = isoToDate(iso);
  const dow = (d.getDay() + 6) % 7; // Monday = 0
  const start = new Date(d); start.setDate(d.getDate() - dow);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return { from: dateToISO(start), to: dateToISO(end) };
}
function getMonthRange(iso) {
  const d = isoToDate(iso);
  const start = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return { from: dateToISO(start), to: dateToISO(end) };
}
function inRange(iso, from, to) { return iso >= from && iso <= to; }

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function pct(numerator, denominator, digits = 0) {
  if (!denominator || denominator === 0) return null;
  return Number(((numerator / denominator) * 100).toFixed(digits));
}
function fmtPct(v) { return v === null || v === undefined || isNaN(v) ? "N/A" : `${v}%`; }

function byId(arr, id) { return arr.find((x) => x.id === id); }
function subjectOf(id) { return byId(state.subjects, id); }
function chapterOf(id) { return byId(state.chapters, id); }
function topicOf(id) { return byId(state.topics, id); }
function chaptersOfSubject(sid) { return state.chapters.filter((c) => c.subject_id === sid).sort((a, b) => a.sort_order - b.sort_order); }
function topicsOfChapter(cid) { return state.topics.filter((t) => t.chapter_id === cid).sort((a, b) => a.sort_order - b.sort_order); }
function tagsOf(entityType, entityId) {
  const ids = state.tagLinks.filter((l) => l.entity_type === entityType && l.entity_id === entityId).map((l) => l.tag_id);
  return state.tags.filter((t) => ids.includes(t.id));
}

function csvEscape(v) {
  if (v === null || v === undefined) return "";
  const s = String(v);
  if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
}
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ============================================================================
   5. DATABASE API
   Thin, explicit wrappers around Supabase calls. Every function throws a
   friendly Error on failure so callers can show a toast; raw errors are
   still logged to console for debugging.
   ============================================================================ */
const TBL = {
  subjects: "study_subjects", chapters: "study_chapters", topics: "study_topics",
  covered: "study_covered", tags: "study_tags", tagLinks: "study_tag_links",
  tests: "study_tests", testSubjects: "study_test_subjects", testChapters: "study_test_chapters",
  mistakes: "study_mistakes", revisions: "study_revisions", settings: "study_settings",
};

function requireDb() {
  if (!SUPA_READY) throw new Error("Study database isn't configured yet. Add your Supabase URL and anon key at the top of the file.");
}

async function dbSelect(table, opts = {}) {
  requireDb();
  let q = sb.from(table).select(opts.select || "*");
  if (opts.order) q = q.order(opts.order.col, { ascending: opts.order.asc !== false });
  const { data, error } = await q;
  if (error) { console.error(`select ${table}`, error); throw new Error(friendlyDbError(error, "load")); }
  return data || [];
}
async function dbInsert(table, row) {
  requireDb();
  const { data, error } = await sb.from(table).insert(row).select();
  if (error) { console.error(`insert ${table}`, error); throw new Error(friendlyDbError(error, "save")); }
  return data;
}
async function dbInsertMany(table, rows) {
  requireDb();
  if (!rows.length) return [];
  const { data, error } = await sb.from(table).insert(rows).select();
  if (error) { console.error(`insertMany ${table}`, error); throw new Error(friendlyDbError(error, "save")); }
  return data;
}
async function dbUpdate(table, id, patch) {
  requireDb();
  const { data, error } = await sb.from(table).update(patch).eq("id", id).select();
  if (error) { console.error(`update ${table}`, error); throw new Error(friendlyDbError(error, "update")); }
  return data;
}
async function dbDelete(table, id) {
  requireDb();
  const { error } = await sb.from(table).delete().eq("id", id);
  if (error) { console.error(`delete ${table}`, error); throw new Error(friendlyDbError(error, "delete")); }
  return true;
}
async function dbDeleteMatch(table, match) {
  requireDb();
  let q = sb.from(table).delete();
  for (const k in match) q = q.eq(k, match[k]);
  const { error } = await q;
  if (error) { console.error(`deleteMatch ${table}`, error); throw new Error(friendlyDbError(error, "delete")); }
  return true;
}

function friendlyDbError(error, verb) {
  const msg = (error && error.message) || "";
  if (/JWT|permission|RLS|policy/i.test(msg)) return `Couldn't ${verb} — permission denied. Check your Supabase RLS policies.`;
  if (/network|fetch/i.test(msg)) return `Couldn't ${verb} — network error. Check your connection.`;
  if (/not configured/i.test(msg)) return error.message;
  return `Couldn't ${verb} this. Please try again.`;
}

/* ============================================================================
   6. DATA LOADING
   ============================================================================ */
async function loadAllData() {
  requireDb();
  const [subjects, chapters, topics, covered, tags, tagLinks, tests, testSubjects, testChapters, mistakes, revisions, settingsRows] =
    await Promise.all([
      dbSelect(TBL.subjects, { order: { col: "sort_order" } }),
      dbSelect(TBL.chapters, { order: { col: "sort_order" } }),
      dbSelect(TBL.topics, { order: { col: "sort_order" } }),
      dbSelect(TBL.covered, { order: { col: "covered_date", asc: false } }),
      dbSelect(TBL.tags, { order: { col: "name" } }),
      dbSelect(TBL.tagLinks),
      dbSelect(TBL.tests, { order: { col: "test_date", asc: false } }),
      dbSelect(TBL.testSubjects),
      dbSelect(TBL.testChapters),
      dbSelect(TBL.mistakes, { order: { col: "created_at", asc: false } }),
      dbSelect(TBL.revisions, { order: { col: "revision_date", asc: false } }),
      dbSelect(TBL.settings),
    ]);
  state.subjects = subjects; state.chapters = chapters; state.topics = topics;
  state.covered = covered; state.tags = tags; state.tagLinks = tagLinks;
  state.tests = tests; state.testSubjects = testSubjects; state.testChapters = testChapters;
  state.mistakes = mistakes; state.revisions = revisions;
  if (settingsRows && settingsRows[0]) {
    state.settings = {
      theme: settingsRows[0].theme || "lavender-dream",
      dark_mode: !!settingsRows[0].dark_mode,
      daily_goal: settingsRows[0].daily_goal ?? 5,
      weekly_goal: settingsRows[0].weekly_goal ?? 25,
      density: settingsRows[0].density || "comfortable",
    };
  }
  state.loaded = true;
}

/* ============================================================================
   7. CRUD FUNCTIONS
   Each function performs the Supabase write, then patches local `state`
   in place so the UI can re-render immediately without a full reload.
   ============================================================================ */

/* ---- Subjects ---- */
async function createDefaultSubjects() {
  const rows = DEFAULT_SUBJECTS.map((s, i) => ({ name: s.name, color: s.color, icon: s.icon, sort_order: i }));
  const inserted = await dbInsertMany(TBL.subjects, rows);
  state.subjects.push(...inserted);
  return inserted;
}
async function addSubject(name, color, icon) {
  const sort_order = state.subjects.length;
  const [row] = await dbInsert(TBL.subjects, { name: name.trim(), color, icon, sort_order });
  state.subjects.push(row);
  return row;
}
async function updateSubjectRec(id, patch) {
  patch.updated_at = new Date().toISOString();
  const [row] = await dbUpdate(TBL.subjects, id, patch);
  Object.assign(subjectOf(id), row);
  return row;
}
async function deleteSubjectRec(id) {
  await dbDelete(TBL.subjects, id);
  const chapIds = chaptersOfSubject(id).map((c) => c.id);
  state.subjects = state.subjects.filter((s) => s.id !== id);
  state.chapters = state.chapters.filter((c) => c.subject_id !== id);
  state.topics = state.topics.filter((t) => !chapIds.includes(t.chapter_id));
  // covered/revisions/mistakes keep their rows (DB sets subject_id/chapter_id/topic_id to NULL via FK), reflect locally:
  state.covered.forEach((c) => { if (c.subject_id === id) c.subject_id = null; });
  state.mistakes.forEach((m) => { if (m.subject_id === id) m.subject_id = null; });
  state.revisions.forEach((r) => { if (r.subject_id === id) r.subject_id = null; });
}
async function reorderSubjectRec(id, dir) {
  const list = [...state.subjects].sort((a, b) => a.sort_order - b.sort_order);
  const i = list.findIndex((s) => s.id === id);
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i].sort_order, list[j].sort_order] = [list[j].sort_order, list[i].sort_order];
  await Promise.all([updateSubjectRec(list[i].id, { sort_order: list[i].sort_order }), updateSubjectRec(list[j].id, { sort_order: list[j].sort_order })]);
}

/* ---- Chapters ---- */
async function addChapterRec(subjectId, name) {
  const sort_order = chaptersOfSubject(subjectId).length;
  const [row] = await dbInsert(TBL.chapters, { subject_id: subjectId, name: name.trim(), sort_order });
  state.chapters.push(row);
  return row;
}
async function updateChapterRec(id, patch) {
  patch.updated_at = new Date().toISOString();
  const [row] = await dbUpdate(TBL.chapters, id, patch);
  Object.assign(chapterOf(id), row);
  return row;
}
async function deleteChapterRec(id) {
  await dbDelete(TBL.chapters, id);
  const topicIds = topicsOfChapter(id).map((t) => t.id);
  state.chapters = state.chapters.filter((c) => c.id !== id);
  state.topics = state.topics.filter((t) => t.chapter_id !== id);
  state.covered.forEach((c) => { if (topicIds.includes(c.topic_id)) c.topic_id = null; if (c.chapter_id === id) c.chapter_id = null; });
  state.mistakes.forEach((m) => { if (m.chapter_id === id) m.chapter_id = null; });
  state.revisions.forEach((r) => { if (r.chapter_id === id) r.chapter_id = null; });
}
async function reorderChapterRec(id, dir) {
  const ch = chapterOf(id);
  const list = chaptersOfSubject(ch.subject_id);
  const i = list.findIndex((c) => c.id === id);
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i].sort_order, list[j].sort_order] = [list[j].sort_order, list[i].sort_order];
  await Promise.all([updateChapterRec(list[i].id, { sort_order: list[i].sort_order }), updateChapterRec(list[j].id, { sort_order: list[j].sort_order })]);
}

/* ---- Topics ---- */
async function addTopicRec(chapterId, name) {
  const sort_order = topicsOfChapter(chapterId).length;
  const [row] = await dbInsert(TBL.topics, { chapter_id: chapterId, name: name.trim(), sort_order, status: "not_started" });
  state.topics.push(row);
  return row;
}
async function updateTopicRec(id, patch) {
  patch.updated_at = new Date().toISOString();
  const [row] = await dbUpdate(TBL.topics, id, patch);
  Object.assign(topicOf(id), row);
  return row;
}
async function deleteTopicRec(id) {
  await dbDelete(TBL.topics, id);
  state.topics = state.topics.filter((t) => t.id !== id);
  state.covered.forEach((c) => { if (c.topic_id === id) c.topic_id = null; });
  state.mistakes.forEach((m) => { if (m.topic_id === id) m.topic_id = null; });
  state.revisions.forEach((r) => { if (r.topic_id === id) r.topic_id = null; });
}
async function setTopicStatusRec(id, status) { return updateTopicRec(id, { status }); }
function reorderTopicRec(id, dir) {
  const t = topicOf(id);
  const list = topicsOfChapter(t.chapter_id);
  const i = list.findIndex((x) => x.id === id);
  const j = i + dir;
  if (j < 0 || j >= list.length) return Promise.resolve();
  [list[i].sort_order, list[j].sort_order] = [list[j].sort_order, list[i].sort_order];
  return Promise.all([updateTopicRec(list[i].id, { sort_order: list[i].sort_order }), updateTopicRec(list[j].id, { sort_order: list[j].sort_order })]);
}

/* ---- Covered history ---- */
async function logCoveredRec({ topicIds, date, note, tagIds }) {
  const rows = topicIds.map((tid) => {
    const topic = topicOf(tid);
    const chapter = chapterOf(topic.chapter_id);
    const subject = subjectOf(chapter.subject_id);
    return {
      topic_id: tid, chapter_id: chapter.id, subject_id: subject.id,
      subject_name: subject.name, chapter_name: chapter.name, topic_name: topic.name,
      covered_date: date, note: note || null,
    };
  });
  const inserted = await dbInsertMany(TBL.covered, rows);
  state.covered.unshift(...inserted);
  // logging as covered marks the topic completed (reversible later)
  await Promise.all(topicIds.map((tid) => setTopicStatusRec(tid, "completed")));
  if (tagIds && tagIds.length) {
    for (const rec of inserted) for (const tagId of tagIds) await linkTagRec("covered", rec.id, tagId);
  }
  return inserted;
}
async function updateCoveredRec(id, patch) {
  const [row] = await dbUpdate(TBL.covered, id, patch);
  Object.assign(byId(state.covered, id), row);
  return row;
}
async function deleteCoveredRec(id) {

/* ---- Tags ---- */
async function getOrCreateTag(name) {
  const clean = name.trim().replace(/^#/, "");
  if (!clean) return null;
  const existing = state.tags.find((t) => t.name.toLowerCase() === clean.toLowerCase());
  if (existing) return existing;
  const [row] = await dbInsert(TBL.tags, { name: clean });
  state.tags.push(row);
  return row;
}
async function deleteTagRec(id) {
  await dbDelete(TBL.tags, id);
  state.tags = state.tags.filter((t) => t.id !== id);
  state.tagLinks = state.tagLinks.filter((l) => l.tag_id !== id);
}
async function linkTagRec(entityType, entityId, tagId) {
  if (state.tagLinks.some((l) => l.entity_type === entityType && l.entity_id === entityId && l.tag_id === tagId)) return;
  try {
    const [row] = await dbInsert(TBL.tagLinks, { entity_type: entityType, entity_id: entityId, tag_id: tagId });
    state.tagLinks.push(row);
  } catch (e) { /* unique constraint race — ignore */ }
}
async function unlinkTagRec(entityType, entityId, tagId) {
  const link = state.tagLinks.find((l) => l.entity_type === entityType && l.entity_id === entityId && l.tag_id === tagId);
  if (!link) return;
  await dbDelete(TBL.tagLinks, link.id);
  state.tagLinks = state.tagLinks.filter((l) => l.id !== link.id);
}

/* ---- Tests ---- */
async function addTestRec(payload) {
  const { subjectIds, chapterIds, tagIds, ...fields } = payload;
  const [row] = await dbInsert(TBL.tests, fields);
  state.tests.unshift(row);
  if (subjectIds?.length) {
    const links = await dbInsertMany(TBL.testSubjects, subjectIds.map((sid) => ({ test_id: row.id, subject_id: sid })));
    state.testSubjects.push(...links);
  }
  if (chapterIds?.length) {
    const links = await dbInsertMany(TBL.testChapters, chapterIds.map((cid) => ({ test_id: row.id, chapter_id: cid })));
    state.testChapters.push(...links);
  }
  if (tagIds?.length) for (const tagId of tagIds) await linkTagRec("test", row.id, tagId);
  return row;
}
async function updateTestRec(id, payload) {
  const { subjectIds, chapterIds, tagIds, ...fields } = payload;
  fields.updated_at = new Date().toISOString();
  const [row] = await dbUpdate(TBL.tests, id, fields);
  Object.assign(byId(state.tests, id), row);
  if (subjectIds) {
    await dbDeleteMatch(TBL.testSubjects, { test_id: id });
    state.testSubjects = state.testSubjects.filter((l) => l.test_id !== id);
    if (subjectIds.length) { const links = await dbInsertMany(TBL.testSubjects, subjectIds.map((sid) => ({ test_id: id, subject_id: sid }))); state.testSubjects.push(...links); }
  }
  if (chapterIds) {
    await dbDeleteMatch(TBL.testChapters, { test_id: id });
    state.testChapters = state.testChapters.filter((l) => l.test_id !== id);
    if (chapterIds.length) { const links = await dbInsertMany(TBL.testChapters, chapterIds.map((cid) => ({ test_id: id, chapter_id: cid }))); state.testChapters.push(...links); }
  }
  if (tagIds) {
    const current = tagsOf("test", id).map((t) => t.id);
    for (const tagId of current) if (!tagIds.includes(tagId)) await unlinkTagRec("test", id, tagId);
    for (const tagId of tagIds) if (!current.includes(tagId)) await linkTagRec("test", id, tagId);
  }
  return row;
}
async function deleteTestRec(id) {
  await dbDelete(TBL.tests, id);
  state.tests = state.tests.filter((t) => t.id !== id);
  state.testSubjects = state.testSubjects.filter((l) => l.test_id !== id);
  state.testChapters = state.testChapters.filter((l) => l.test_id !== id);
  state.tagLinks = state.tagLinks.filter((l) => !(l.entity_type === "test" && l.entity_id === id));
  state.mistakes.forEach((m) => { if (m.test_id === id) m.test_id = null; });
}

async function importJSONFile(payload, mode) {
  const required = ["subjects", "chapters", "topics", "covered"];
  if (!payload || typeof payload !== "object" || !required.every((k) => Array.isArray(payload[k]))) {
    throw new Error("This file doesn't look like a Study Tracker backup.");
  }
  if (mode === "replace") {
    for (const t of [TBL.tagLinks, TBL.testSubjects, TBL.testChapters, TBL.mistakes, TBL.revisions, TBL.covered, TBL.tests, TBL.topics, TBL.chapters, TBL.subjects, TBL.tags]) {
      const rows = await dbSelect(t);
      for (const r of rows) await dbDelete(t, r.id ?? r.test_id).catch(() => {});
    }
  }
  // Re-insert with fresh IDs, remapping relationships through a local id map.
  const map = {};
  const remap = (oldId) => (oldId ? map[oldId] || null : null);

  for (const s of payload.subjects || []) {
    const [row] = await dbInsert(TBL.subjects, { name: s.name, color: s.color, icon: s.icon, sort_order: s.sort_order ?? 0 });
    map[s.id] = row.id; state.subjects.push(row);
  }
  for (const c of payload.chapters || []) {
    const sid = remap(c.subject_id); if (!sid) continue;
    const [row] = await dbInsert(TBL.chapters, { subject_id: sid, name: c.name, sort_order: c.sort_order ?? 0 });
    map[c.id] = row.id; state.chapters.push(row);
  }
  for (const t of payload.topics || []) {
    const cid = remap(t.chapter_id); if (!cid) continue;
    const [row] = await dbInsert(TBL.topics, { chapter_id: cid, name: t.name, status: t.status || "not_started", sort_order: t.sort_order ?? 0 });
    map[t.id] = row.id; state.topics.push(row);
  }
  for (const tg of payload.tags || []) {
    const existing = state.tags.find((x) => x.name.toLowerCase() === tg.name.toLowerCase());
    if (existing) { map[tg.id] = existing.id; continue; }
    const [row] = await dbInsert(TBL.tags, { name: tg.name });
    map[tg.id] = row.id; state.tags.push(row);
  }
  for (const c of payload.covered || []) {
    const [row] = await dbInsert(TBL.covered, {
      topic_id: remap(c.topic_id), chapter_id: remap(c.chapter_id), subject_id: remap(c.subject_id),
      subject_name: c.subject_name, chapter_name: c.chapter_name, topic_name: c.topic_name,
      covered_date: c.covered_date, note: c.note || null,
    });
    map[c.id] = row.id; state.covered.push(row);
  }
  for (const t of payload.tests || []) {
    const [row] = await dbInsert(TBL.tests, {
      name: t.name, test_date: t.test_date, total_questions: t.total_questions, attempted: t.attempted,
      correct: t.correct, wrong: t.wrong, unattempted: t.unattempted, marks_obtained: t.marks_obtained,
      max_marks: t.max_marks, time_taken_minutes: t.time_taken_minutes, notes: t.notes,
    });
    map[t.id] = row.id; state.tests.push(row);
  }
  for (const l of payload.test_subjects || []) { const tid = remap(l.test_id), sid = remap(l.subject_id); if (tid && sid) { const [row] = await dbInsert(TBL.testSubjects, { test_id: tid, subject_id: sid }); state.testSubjects.push(row); } }
  for (const l of payload.test_chapters || []) { const tid = remap(l.test_id), cid = remap(l.chapter_id); if (tid && cid) { const [row] = await dbInsert(TBL.testChapters, { test_id: tid, chapter_id: cid }); state.testChapters.push(row); } }
  for (const m of payload.mistakes || []) {
    const [row] = await dbInsert(TBL.mistakes, {
      test_id: remap(m.test_id), subject_id: remap(m.subject_id), chapter_id: remap(m.chapter_id), topic_id: remap(m.topic_id),
      mistake_type: m.mistake_type || "other", explanation: m.explanation, status: m.status || "pending",
    });
    state.mistakes.push(row);
  }
  for (const r of payload.revisions || []) {
    const [row] = await dbInsert(TBL.revisions, {
      topic_id: remap(r.topic_id), chapter_id: remap(r.chapter_id), subject_id: remap(r.subject_id),
      subject_name: r.subject_name, chapter_name: r.chapter_name, topic_name: r.topic_name,
      revision_number: r.revision_number || 1, revision_date: r.revision_date, next_revision_date: r.next_revision_date,
      confidence: r.confidence, note: r.note,
    });
    state.revisions.push(row);
  }
  for (const l of payload.tag_links || []) {
    const eid = remap(l.entity_id), tid = remap(l.tag_id);
    if (eid && tid) { const [row] = await dbInsert(TBL.tagLinks, { entity_type: l.entity_type, entity_id: eid, tag_id: tid }); state.tagLinks.push(row); }
  }
  if (payload.settings) await updateSettingsRec(payload.settings);
}

/* ============================================================================
   8. ANALYTICS
   ============================================================================ */
function activeDatesSet() {
  const s = new Set();
  state.covered.forEach((c) => s.add(c.covered_date));
  state.revisions.forEach((r) => s.add(r.revision_date));
  state.tests.forEach((t) => s.add(t.test_date));
  return s;
}
function computeStreak() {
  const set = activeDatesSet();
  const today = todayISO();
  let cursor = today;
  if (!set.has(cursor)) {
    cursor = addDays(today, -1);
    if (!set.has(cursor)) return 0;
  }
  let streak = 0;
  while (set.has(cursor)) { streak++; cursor = addDays(cursor, -1); }
  return streak;
}
function rangeFor(kind) {
  const today = todayISO();
  if (kind === "today") return { from: today, to: today, label: "Today" };
  if (kind === "week") { const w = getWeekRange(today); return { ...w, label: "This Week" }; }
  if (kind === "month") { const m = getMonthRange(today); return { ...m, label: "This Month" }; }
  return { from: state.ui.dashboardCustom.from, to: state.ui.dashboardCustom.to, label: "Custom" };
}
function coveredInRange(from, to) { return state.covered.filter((c) => inRange(c.covered_date, from, to)); }

function dashboardStats() {
  const r = rangeFor(state.ui.dashboardRange);
  const coveredCount = coveredInRange(r.from, r.to).length;
  const streak = computeStreak();
  const today = todayISO();
  const todayCount = coveredInRange(today, today).length;
  const week = getWeekRange(today);
  const weekCount = coveredInRange(week.from, week.to).length;
  const pendingTopics = state.topics.filter((t) => t.status !== "completed").length;
  return { range: r, coveredCount, streak, todayCount, weekCount, pendingTopics, dailyGoal: state.settings.daily_goal, weeklyGoal: state.settings.weekly_goal };
}

function whatCanCoverNext() {
  const groups = [];
  for (const subject of [...state.subjects].sort((a, b) => a.sort_order - b.sort_order)) {
    const chIds = chaptersOfSubject(subject.id).map((c) => c.id);
    const pending = state.topics.filter((t) => chIds.includes(t.chapter_id) && t.status !== "completed")
      .sort((a, b) => (a.status === b.status ? a.sort_order - b.sort_order : a.status === "in_progress" ? -1 : 1));
    if (pending.length) groups.push({ subject, topics: pending.slice(0, 6), total: pending.length });
  }
  return groups;
}

function testAnalytics() {
  const tests = state.tests;
  if (!tests.length) return null;
  const withPct = tests.map((t) => testPercentage(t)).filter((v) => v !== null);
  const avgPct = withPct.length ? Number((withPct.reduce((a, b) => a + b, 0) / withPct.length).toFixed(1)) : null;
  const bestPct = withPct.length ? Math.max(...withPct) : null;
  const sorted = [...tests].sort((a, b) => (a.test_date < b.test_date ? 1 : -1));
  const latestPct = testPercentage(sorted[0]);
  const marksVals = tests.map((t) => Number(t.marks_obtained)).filter((v) => !isNaN(v));
  const avgMarks = marksVals.length ? Number((marksVals.reduce((a, b) => a + b, 0) / marksVals.length).toFixed(1)) : null;
  const bestMarks = marksVals.length ? Math.max(...marksVals) : null;
  const totalAttempted = tests.reduce((a, t) => a + (Number(t.attempted) || 0), 0);
  const totalCorrect = tests.reduce((a, t) => a + (Number(t.correct) || 0), 0);
  const overallAccuracy = pct(totalCorrect, totalAttempted, 1);
  return { totalTests: tests.length, avgPct, bestPct, latestPct, avgMarks, bestMarks, totalAttempted, overallAccuracy, sorted };
}

function latestRevisionsByTopic() {
  const byTopic = {};
  for (const r of state.revisions) {
    if (!r.topic_id) continue;
    if (!byTopic[r.topic_id] || r.revision_date > byTopic[r.topic_id].revision_date) byTopic[r.topic_id] = r;
  }
  return Object.values(byTopic);
}
function revisionsDue() {
  const today = todayISO();
  return latestRevisionsByTopic().filter((r) => r.next_revision_date && r.next_revision_date <= today && topicOf(r.topic_id))
    .sort((a, b) => (a.next_revision_date < b.next_revision_date ? -1 : 1));
}
function pendingMistakes() { return state.mistakes.filter((m) => m.status === "pending"); }

function subjectActivityDistribution() {
  const counts = {};
  state.covered.forEach((c) => { if (c.subject_id) counts[c.subject_id] = (counts[c.subject_id] || 0) + 1; });
  return state.subjects.map((s) => ({ subject: s, count: counts[s.id] || 0 })).filter((x) => x.count > 0).sort((a, b) => b.count - a.count);
}
function weeklyActivitySeries() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const iso = addDays(todayISO(), -i);
    days.push({ date: iso, count: coveredInRange(iso, iso).length });
  }
  return days;
}
function topicsCoveredOverTime(daysBack = 30) {
  const out = [];
  for (let i = daysBack - 1; i >= 0; i--) {
    const iso = addDays(todayISO(), -i);
    out.push({ date: iso, count: coveredInRange(iso, iso).length });
  }
  return out;
}
function achievements() {
  const coveredTotal = state.covered.length;
  const testsTotal = state.tests.length;
  const streak = computeStreak();
  return [
    { label: "First topic covered", icon: "sparkles", achieved: coveredTotal >= 1 },
    { label: "10 topics covered", icon: "flame", achieved: coveredTotal >= 10 },
    { label: "50 topics covered", icon: "trophy", achieved: coveredTotal >= 50 },
    { label: "100 topics covered", icon: "crown", achieved: coveredTotal >= 100 },
    { label: "5 tests completed", icon: "clipboard-check", achieved: testsTotal >= 5 },
    { label: "7-day study streak", icon: "zap", achieved: streak >= 7 },
  ];
}
function insights() {
  const out = [];
  const week = getWeekRange(todayISO());
  const weekCount = coveredInRange(week.from, week.to).length;
  if (weekCount > 0) out.push(`You covered ${weekCount} topic${weekCount === 1 ? "" : "s"} this week.`);
  const dist = subjectActivityDistribution();
  if (dist.length) out.push(`${dist[0].subject.name} has been your most active subject.`);
  const pendingBySubject = {};
  state.topics.forEach((t) => {
    if (t.status === "completed") return;
    const ch = chapterOf(t.chapter_id); if (!ch) return;
    pendingBySubject[ch.subject_id] = (pendingBySubject[ch.subject_id] || 0) + 1;
  });
  const topPending = Object.entries(pendingBySubject).sort((a, b) => b[1] - a[1])[0];
  if (topPending) { const subj = subjectOf(topPending[0]); if (subj) out.push(`You have ${topPending[1]} pending topic${topPending[1] === 1 ? "" : "s"} in ${subj.name}.`); }
  const ta = testAnalytics();
  if (ta && ta.avgPct !== null) out.push(`Your recent test average is ${ta.avgPct}%.`);
  return out.slice(0, 4);
}

function globalSearch(query) {
  const q = query.trim().toLowerCase();
  if (!q) return null;
  const subjects = state.subjects.filter((s) => s.name.toLowerCase().includes(q));
  const chapters = state.chapters.filter((c) => c.name.toLowerCase().includes(q));
  const topics = state.topics.filter((t) => t.name.toLowerCase().includes(q));
  const covered = state.covered.filter((c) => c.topic_name.toLowerCase().includes(q) || (c.note || "").toLowerCase().includes(q)).slice(0, 8);
  const tests = state.tests.filter((t) => t.name.toLowerCase().includes(q));
  const tags = state.tags.filter((t) => t.name.toLowerCase().includes(q));
  const mistakes = state.mistakes.filter((m) => (m.explanation || "").toLowerCase().includes(q));
  return { subjects, chapters, topics, covered, tests, tags, mistakes,
    total: subjects.length + chapters.length + topics.length + covered.length + tests.length + tags.length + mistakes.length };
}

   ============================================================================ */
function filteredCovered() {
  const f = state.ui.studyFilters;
  let list = [...state.covered];
  if (f.range === "today") { const t = todayISO(); list = list.filter((c) => c.covered_date === t); }
  else if (f.range === "week") { const w = getWeekRange(todayISO()); list = list.filter((c) => inRange(c.covered_date, w.from, w.to)); }
  else if (f.range === "month") { const m = getMonthRange(todayISO()); list = list.filter((c) => inRange(c.covered_date, m.from, m.to)); }
  else if (f.range === "custom" && f.customFrom && f.customTo) { list = list.filter((c) => inRange(c.covered_date, f.customFrom, f.customTo)); }
  if (f.subjectId) list = list.filter((c) => c.subject_id === f.subjectId);
  if (f.chapterId) list = list.filter((c) => c.chapter_id === f.chapterId);
  if (f.tagId) { const ids = state.tagLinks.filter((l) => l.entity_type === "covered" && l.tag_id === f.tagId).map((l) => l.entity_id); list = list.filter((c) => ids.includes(c.id)); }
  if (f.search) { const q = f.search.toLowerCase(); list = list.filter((c) => c.topic_name.toLowerCase().includes(q) || c.chapter_name.toLowerCase().includes(q) || c.subject_name.toLowerCase().includes(q) || (c.note || "").toLowerCase().includes(q)); }
  return list.sort((a, b) => (a.covered_date < b.covered_date ? 1 : a.covered_date > b.covered_date ? -1 : (a.created_at < b.created_at ? 1 : -1)));
}
function groupByDay(list, dateField) {
  const groups = [];
  let lastDate = null;
  for (const item of list) {
    const d = item[dateField];
    if (d !== lastDate) { groups.push({ date: d, items: [] }); lastDate = d; }
    groups[groups.length - 1].items.push(item);
  }
  return groups;
}

/* ============================================================================
   11. UI RENDERING — shell, router, top-level render()
   ============================================================================ */
function render() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && "selectionStart" in active ? active.selectionStart : null;
  const selEnd = active && "selectionEnd" in active ? active.selectionEnd : null;

  const root = document.getElementById("app");
  root.innerHTML = shellHTML();

  if (window.lucide) lucide.createIcons();
  initChartsForCurrentView();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

function greeting() {
  const h = new Date().getHours();
  if (h < 5) return "Still up?";

  if (h < 17) return "Good afternoon";

  return "Good night";
}

function chapterRowHTML(c, i, total) {

/* ============================================================================
   17. CALENDAR VIEW
   ============================================================================ */
function viewCalendar() {
  const y = state.ui.calendarYear, m = state.ui.calendarMonth;
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7; // Monday-start
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const monthLabel = first.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const sel = state.ui.calendarSelectedDate;
  const selInfo = sel ? dayActivity(sel) : null;

  return `
    <div class="section-head"><h2>Calendar</h2>
      <div class="flex-gap">
        <button class="icon-btn btn-sm" data-action="cal-prev"><i data-lucide="chevron-left" class="icon-sm"></i></button>
        <strong style="min-width:150px;text-align:center;display:inline-block;">${monthLabel}</strong>
        <button class="icon-btn btn-sm" data-action="cal-next"><i data-lucide="chevron-right" class="icon-sm"></i></button>
        <button class="btn btn-sm btn-secondary" data-action="cal-today">Today</button>
      </div>
    </div>
    <div class="grid grid-2" style="align-items:start;">
      <div class="card">
        <div class="cal-grid">
          ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d) => `<div class="cal-dow">${d}</div>`).join("")}
          ${cells.map((d) => {
            if (!d) return `<div class="cal-cell empty"></div>`;
            const iso = dateToISO(new Date(y, m, d));
            const act = dayActivity(iso);
            const isToday = iso === todayISO();
            const isSel = iso === sel;
            return `<div class="cal-cell ${isToday?"today":""} ${isSel?"selected":""}" data-action="cal-select" data-date="${iso}">
              <span class="d">${d}</span>
              <span class="cal-dots">
                ${act.covered.length ? `<span class="cal-dot" style="background:var(--primary)"></span>` : ""}
                ${act.tests.length ? `<span class="cal-dot" style="background:var(--accent)"></span>` : ""}
                ${act.revisions.length ? `<span class="cal-dot" style="background:var(--success)"></span>` : ""}
              </span>
            </div>`;
          }).join("")}
        </div>
        <div class="flex-gap small muted" style="margin-top:14px;">
          <span class="flex-gap"><span class="cal-dot" style="background:var(--primary)"></span>Covered</span>
          <span class="flex-gap"><span class="cal-dot" style="background:var(--accent)"></span>Test</span>
          <span class="flex-gap"><span class="cal-dot" style="background:var(--success)"></span>Revision</span>
        </div>
      </div>
      <div class="card">
        <div class="card-title-row"><span class="card-title"><i data-lucide="calendar-days" class="icon"></i>${sel ? friendlyDate(sel) : "Select a date"}</span></div>
        ${sel && selInfo ? dayActivityHTML(selInfo) : emptyStateHTML("mouse-pointer-click", "Pick a day", "Click any day on the calendar to see what happened.")}
      </div>
    </div>
  `;
}
function dayActivity(iso) {
  return {
    covered: state.covered.filter((c) => c.covered_date === iso),
    tests: state.tests.filter((t) => t.test_date === iso),
    revisions: state.revisions.filter((r) => r.revision_date === iso),
    mistakes: state.mistakes.filter((m) => (m.created_at || "").slice(0, 10) === iso),
  };
}
function dayActivityHTML(info) {
  const total = info.covered.length + info.tests.length + info.revisions.length + info.mistakes.length;
  if (!total) return emptyStateHTML("moon-star", "No activity that day.", "Nothing was logged on this date.");
  return `
    ${info.covered.length ? `<h4 style="font-size:12.5px;color:var(--muted);margin-bottom:6px;">COVERED</h4>${info.covered.map((c) => coveredRowHTML(c, true)).join("")}` : ""}
    ${info.tests.length ? `<h4 style="font-size:12.5px;color:var(--muted);margin:14px 0 6px;">TESTS</h4>${info.tests.map(testRowHTML).join("")}` : ""}
    ${info.revisions.length ? `<h4 style="font-size:12.5px;color:var(--muted);margin:14px 0 6px;">REVISIONS</h4>${info.revisions.map(revisionRowHTML).join("")}` : ""}
    ${info.mistakes.length ? `<h4 style="font-size:12.5px;color:var(--muted);margin:14px 0 6px;">MISTAKES</h4>${info.mistakes.map(mistakeRowHTML).join("")}` : ""}
  `;
}

/* ============================================================================
   22. MODALS
   ============================================================================ */
let pendingConfirmAction = null;

function openModal(type, payload) { state.ui.modal = { type, payload: payload || {} }; render(); }
function closeModal() { state.ui.modal = null; render(); }
function openConfirm(title, message, onConfirm, confirmLabel) {
  pendingConfirmAction = onConfirm;
  openModal("confirm", { title, message, confirmLabel: confirmLabel || "Delete" });
}

function modalOverlayHTML() {
  const { type, payload } = state.ui.modal;
  return `<div class="modal-overlay" data-action="close-modal-bg">
    <div class="modal-box ${["test","chapter-overview"].includes(type) ? "modal-wide" : ""}" onclick="event.stopPropagation()">
      ${modalInnerHTML(type, payload)}
    </div>
  </div>`;
}

function modalInnerHTML(type, payload) {
  switch (type) {
    case "quickadd": return quickAddModalHTML();
    case "covered": return coveredModalHTML(payload);
    case "subject": return subjectModalHTML(payload);
    case "chapter": return chapterModalHTML(payload);
    case "chapter-overview": return chapterOverviewModalHTML(payload);
    case "topic": return topicModalHTML(payload);
    case "test": return testModalHTML(payload);
    case "mistake": return mistakeModalHTML(payload);
    case "revision": return revisionModalHTML(payload);
    case "confirm": return confirmModalHTML(payload);
    case "import": return importModalHTML(payload);
    default: return "";
  }
}
function modalHead(title, extra) {
  return `<div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="icon-btn" data-action="close-modal"><i data-lucide="x" class="icon"></i></button></div>${extra||""}`;
}

    { modal: "revision", icon: "rotate-ccw", label: "Revision", desc: "Log a topic you revised" },
    { modal: "mistake", icon: "flag", label: "Mistake", desc: "Track a mistake to fix" },
    { modal: "topic", icon: "file-text", label: "Topic", desc: "Add a new topic" },

          <div class="entry-icon" style="background:${it.primary?"var(--primary)":"var(--surface-2)"};color:${it.primary?"#fff":"var(--text)"};margin:0;"><i data-lucide="${it.icon}" class="icon icon-sm"></i></div>

/* ---- What I Covered ---- */
function coveredModalHTML(payload) {
  const editing = !!payload.id;
  const rec = editing ? byId(state.covered, payload.id) : null;
  const presetSubjectId = rec ? rec.subject_id : (payload.subjectId || (state.subjects[0]?.id || ""));

  if (!state.subjects.length) {
    return `${modalHead("What I Covered")}<div class="modal-body">${emptyStateHTML("library", "Add a subject first", "You need at least one subject and topic before logging what you covered.")}</div>
    <div class="modal-foot"><button class="btn btn-secondary" data-action="close-modal">Close</button><button class="btn btn-primary" data-action="switch-modal" data-modal="subject">Add Subject</button></div>`;
  }

  return `
    ${modalHead(editing ? "Edit Covered Entry" : "What I Covered")}
    <div class="modal-body">
      <form id="covered-form">
        <div class="field-row">
          <div class="field"><label>Subject</label>
            <select id="covered-subject-select" data-action="covered-subject-change">
              ${state.subjects.map((s) => `<option value="${s.id}" ${s.id===presetSubjectId?"selected":""}>${escapeHtml(s.name)}</option>`).join("")}
            </select>
          </div>
          <div class="field"><label>Chapter</label>
            <select id="covered-chapter-select" data-action="covered-chapter-change">${chapterOptionsHTML(presetSubjectId, presetChapterId)}</select>

          <div class="topic-pick-list" id="covered-topic-list">${topicPickListHTML(presetChapterId, editing ? [rec.topic_id] : [], editing)}</div>
        </div>

          <div class="field"><label>Tags <span class="muted">(comma separated, optional)</span></label><input type="text" id="covered-tags" placeholder="important, revision" value="${escapeHtml(existingTags)}"></div>
        </div>

function chapterOptionsHTML(subjectId, selectedId) {
  const chs = chaptersOfSubject(subjectId);
  if (!chs.length) return `<option value="">No chapters yet</option>`;
  return chs.map((c) => `<option value="${c.id}" ${c.id===selectedId?"selected":""}>${escapeHtml(c.name)}</option>`).join("");
}
function topicPickListHTML(chapterId, selectedIds, singleSelect) {
  const topics = topicsOfChapter(chapterId);
  if (!topics.length) return `<p class="muted small" style="padding:8px;">No topics in this chapter yet. Add one from Subjects → Chapter Overview.</p>`;
  return topics.map((t) => `
    <label class="topic-pick-row">
      <input type="${singleSelect ? "radio" : "checkbox"}" name="covered-topic-pick" value="${t.id}" ${selectedIds.includes(t.id)?"checked":""} style="accent-color:var(--primary);width:16px;height:16px;">

      <span style="font-size:13.5px;">${escapeHtml(t.name)}</span>

}

/* ============================================================================
   23. TOASTS
   ============================================================================ */
function toast(message, type) {
  const container = document.getElementById("toast-container");
  if (!container) return;
  const el = document.createElement("div");
  el.className = `toast ${type === "error" ? "err" : type === "success" ? "ok" : ""}`;
  el.innerHTML = `<i data-lucide="${type === "error" ? "x-circle" : "check-circle-2"}" class="icon icon-sm"></i><span>${escapeHtml(message)}</span>`;
  container.appendChild(el);
  if (window.lucide) lucide.createIcons();
  setTimeout(() => { el.style.transition = "opacity .25s, transform .25s"; el.style.opacity = "0"; el.style.transform = "translateX(24px)"; setTimeout(() => el.remove(), 260); }, 3400);
}
function toastOk(msg) { toast(msg, "success"); }
function toastErr(msg) { toast(msg, "error"); }

async function withSaving(fn) {
  if (state.ui.saving) return;
  state.ui.saving = true;
  try { await fn(); } finally { state.ui.saving = false; }
}

   ============================================================================ */
const chartInstances = {};
function destroyAllCharts() {
  Object.values(chartInstances).forEach((c) => { try { c.destroy(); } catch (e) {} });
  for (const k in chartInstances) delete chartInstances[k];
}
function renderLineChart(canvasId, labels, data) {
  const el = document.getElementById(canvasId);
  if (!el || !window.Chart) return;
  const primary = cssVar("--primary"), text = cssVar("--text"), border = cssVar("--border");
  chartInstances[canvasId] = new Chart(el, {
    type: "line",
    data: { labels, datasets: [{ data, borderColor: primary, backgroundColor: primary + "33", fill: true, tension: .35, pointBackgroundColor: primary, pointRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 100, grid: { color: border }, ticks: { color: text, callback: (v) => v + "%" } }, x: { grid: { display: false }, ticks: { color: text } } } },
  });
}
function renderBarChart(canvasId, labels, data) {
  const el = document.getElementById(canvasId);
  if (!el || !window.Chart) return;
  const primary = cssVar("--primary"), text = cssVar("--text"), border = cssVar("--border");
  chartInstances[canvasId] = new Chart(el, {
    type: "bar",
    data: { labels, datasets: [{ data, backgroundColor: primary, borderRadius: 5, maxBarThickness: 26 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { color: text, precision: 0 }, grid: { color: border } }, x: { grid: { display: false }, ticks: { color: text, maxRotation: 0, autoSkip: true } } } },
  });
}
function renderDoughnutChart(canvasId, labels, data, colors) {
  const el = document.getElementById(canvasId);
  if (!el || !window.Chart) return;
  const text = cssVar("--text");
  chartInstances[canvasId] = new Chart(el, {
    type: "doughnut",
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: cssVar("--surface") }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { color: text, boxWidth: 10, font: { size: 11 } } } } },
  });
}
function initChartsForCurrentView() {
  if (!window.Chart) return;
  destroyAllCharts();
  const v = state.ui.view;
  const ta = testAnalytics();
  if (v === "dashboard" && ta) {
    const rows = ta.sorted.slice(0, 8).reverse();
    renderLineChart("chart-dash-tests", rows.map((t) => friendlyDate(t.test_date)), rows.map((t) => testPercentage(t)));
  }
  if (v === "tests" && ta) {
    const rows = ta.sorted.slice().reverse();
    renderLineChart("chart-test-trend", rows.map((t) => friendlyDate(t.test_date)), rows.map((t) => testPercentage(t)));
  }
  if (v === "analytics") {
    const series30 = topicsCoveredOverTime(30);
    renderBarChart("chart-covered-30", series30.map((d) => d.date.slice(5)), series30.map((d) => d.count));
    const week = weeklyActivitySeries();
    renderBarChart("chart-week-activity", week.map((d) => friendlyDate(d.date)), week.map((d) => d.count));
    const dist = subjectActivityDistribution();
    if (dist.length) renderDoughnutChart("chart-subject-dist", dist.map((d) => d.subject.name), dist.map((d) => d.count), dist.map((d) => d.subject.color));
    if (ta) { const rows = ta.sorted.slice().reverse(); renderLineChart("chart-analytics-test-trend", rows.map((t) => friendlyDate(t.test_date)), rows.map((t) => testPercentage(t))); }
  }
}

function splitTagInput(str) { return (str || "").split(",").map((s) => s.trim()).filter(Boolean); }
async function resolveTagIds(str) {
  const names = splitTagInput(str);
  const ids = [];
  for (const n of names) { const t = await getOrCreateTag(n); if (t) ids.push(t.id); }
  return ids;
}
async function syncEntityTags(entityType, entityId, tagStr) {
  const wantIds = await resolveTagIds(tagStr);
  const current = tagsOf(entityType, entityId).map((t) => t.id);
  for (const id of current) if (!wantIds.includes(id)) await unlinkTagRec(entityType, entityId, id);
  for (const id of wantIds) if (!current.includes(id)) await linkTagRec(entityType, entityId, id);
}
function numOrNull(v) { if (v === "" || v === null || v === undefined) return null; const n = Number(v); return isNaN(n) ? null : n; }

async function handleRunConfirm() {
  const fn = pendingConfirmAction;
  pendingConfirmAction = null;
  if (!fn) { closeModal(); return; }
  await withSaving(async () => {
    try { await fn(); } catch (e) { console.error(e); toastErr(e.message || "Something went wrong."); render(); }
  });
}

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) {
    if (state.ui.searchOpen && !e.target.closest(".search-wrap")) { state.ui.searchOpen = false; render(); }
    return;
  }
  const action = el.dataset.action;

  try {
    switch (action) {
      /* ---- nav / shell ---- */
      case "nav":
        state.ui.view = el.dataset.view; state.ui.mobileDrawerOpen = false; state.ui.moreSheetOpen = false; state.ui.searchOpen = false;
        render(); break;
      case "open-quickadd": openModal("quickadd"); break;
      case "toggle-dark": await updateSettingsRec({ dark_mode: !state.settings.dark_mode }); applyThemeToDOM(); render(); break;
      case "open-drawer": state.ui.mobileDrawerOpen = true; render(); break;
      case "close-drawer": state.ui.mobileDrawerOpen = false; render(); break;
      case "close-drawer-bg": if (e.target === el) { state.ui.mobileDrawerOpen = false; render(); } break;
      case "open-more": state.ui.moreSheetOpen = true; render(); break;
      case "close-more": state.ui.moreSheetOpen = false; render(); break;
      case "retry-init": if (initSupabaseClient()) { await bootLoad(); } render(); break;
      case "retry-load": await bootLoad(); render(); break;

      /* ---- search results navigation ---- */
      case "nav-subject": state.ui.view = "subjects"; state.ui.expandedSubjectId = el.dataset.id; state.ui.searchOpen = false; state.ui.searchQuery = ""; render(); break;
      case "nav-chapter": { const c = chapterOf(el.dataset.id); state.ui.view = "subjects"; state.ui.expandedSubjectId = c?.subject_id || null; state.ui.searchOpen = false; state.ui.searchQuery = ""; render(); break; }
      case "nav-topic": { const t = topicOf(el.dataset.id); const c = t && chapterOf(t.chapter_id); state.ui.view = "subjects"; state.ui.expandedSubjectId = c?.subject_id || null; state.ui.searchOpen = false; state.ui.searchQuery = ""; render(); if (c) openModal("chapter-overview", { id: c.id }); break; }
      case "nav-covered": state.ui.view = "study"; state.ui.searchOpen = false; state.ui.searchQuery = ""; render(); break;
      case "nav-test": state.ui.searchOpen = false; state.ui.searchQuery = ""; openModal("test", { id: el.dataset.id }); break;
      case "nav-tag": state.ui.view = "study"; state.ui.studyFilters.tagId = el.dataset.id; state.ui.searchOpen = false; state.ui.searchQuery = ""; render(); break;
      case "nav-mistake": state.ui.view = "mistakes"; state.ui.searchOpen = false; state.ui.searchQuery = ""; render(); break;

      /* ---- dashboard ---- */
      case "set-dash-range": state.ui.dashboardRange = el.dataset.range; render(); break;
      case "use-default-subjects": await withSaving(async () => { await createDefaultSubjects(); toastOk("Default subjects added"); }); render(); break;
      case "quick-cover-topic": await withSaving(async () => { await logCoveredRec({ topicIds: [el.dataset.id], date: todayISO(), note: null, tagIds: [] }); toastOk("Marked as covered"); }); render(); break;
      case "edit-covered": openModal("covered", { id: el.dataset.id }); break;
      case "delete-covered": openConfirm("Delete this entry?", "This removes this covered record from your history. This can't be undone.", async () => { await deleteCoveredRec(el.dataset.id); toastOk("Covered entry deleted"); closeModal(); }); break;
      case "resolve-mistake": await withSaving(async () => { await toggleMistakeStatusRec(el.dataset.id); toastOk("Mistake resolved"); }); render(); break;

      /* ---- generic modal open/close ---- */
      case "open-modal": openModal(el.dataset.modal, readModalPayload(el)); break;
      case "switch-modal": case "quickadd-choose": openModal(el.dataset.modal, {}); break;
      case "close-modal-bg": if (e.target === el) closeModal(); break;
      case "close-modal": closeModal(); break;
      case "run-confirm": await handleRunConfirm(); break;

      /* ---- study view filters ---- */
      case "clear-study-filters": state.ui.studyFilters = { range: "all", subjectId: "", chapterId: "", tagId: "", search: "" }; render(); break;
      case "export-covered-csv": exportCoveredCSV(); break;

      /* ---- subjects view ---- */
      case "toggle-subject": state.ui.expandedSubjectId = state.ui.expandedSubjectId === el.dataset.id ? null : el.dataset.id; render(); break;
      case "reorder-subject": await withSaving(() => reorderSubjectRec(el.dataset.id, Number(el.dataset.dir))); render(); break;
      case "delete-subject": { const s = subjectOf(el.dataset.id); openConfirm(`Delete "${s.name}"?`, "This deletes all its chapters and topics. Your covered history, tests, and revisions stay intact but lose their subject link.", async () => { await deleteSubjectRec(el.dataset.id); toastOk("Subject deleted"); closeModal(); }); break; }
      case "reorder-chapter": await withSaving(() => reorderChapterRec(el.dataset.id, Number(el.dataset.dir))); render(); break;
      case "delete-chapter": { const c = chapterOf(el.dataset.id); openConfirm(`Delete "${c.name}"?`, "This deletes all topics in this chapter. Historical records stay intact but lose their chapter link.", async () => { await deleteChapterRec(el.dataset.id); toastOk("Chapter deleted"); closeModal(); }); break; }

      /* ---- chapter overview modal ---- */
      case "add-topic-inline": await handleAddTopicInline(el.dataset.chapterId); break;
      case "cycle-topic-status": await withSaving(async () => {
          const t = topicOf(el.dataset.id);
